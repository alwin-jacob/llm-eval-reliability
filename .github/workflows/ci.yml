name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -q
      - name: Deterministic example smoke test
        run: |
          evalrel validate-dataset examples/datasets/core/v1
          evalrel run examples/configs/candidate.json --output /tmp/candidate-run.json
          evalrel summarize /tmp/candidate-run.json --output /tmp/candidate-summary.json
