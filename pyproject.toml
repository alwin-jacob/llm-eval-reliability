[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalreliability"
version = "0.1.0"
description = "A failure-aware evaluation harness for stochastic model and agent behavior"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Alwin Jacob"}]
dependencies = [
  "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
]
dev = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
  "uvicorn>=0.32,<1",
]

[project.scripts]
evalrel = "evalreliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:.*event_loop_policy.*:DeprecationWarning:pytest_asyncio.plugin",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["evalreliability"]
